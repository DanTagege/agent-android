name: E2E (emulator)

# 在真实 Android 模拟器上跑一遍端到端流程。
# 手动触发：Actions → E2E (emulator) → Run workflow
on:
  workflow_dispatch:
  schedule:
    # 每周一 03:00 UTC 跑一次，防止上游 adb / uiautomator 行为变化未被发现
    - cron: "0 3 * * 1"

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub 的 Linux runner 自带 KVM，模拟器可以硬件加速
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            export PYTHONPATH=.
            python -m agent_android doctor
            python -m agent_android snapshot --compact
            python -m agent_android run examples/settings-info.json --report e2e.json
            python -m agent_android run examples/loop-and-branch.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e.json
            *.png
          if-no-files-found: ignore
