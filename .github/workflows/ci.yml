name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: CLI unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests with coverage
        env:
          PYTHONPATH: .
        run: |
          python -m pip install --quiet coverage
          coverage run --source=agent_android -m unittest discover -s tests
          coverage report -m

  android:
    name: Companion APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设置），
      # 不再用 android-actions/setup-android 在线拉 cmdline-tools ——
      # 这一步在 CI 上经常因为下载失败而让整个 job 挂掉
      - name: Accept SDK licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          else
            echo "cmdline-tools 不存在，跳过（预装 SDK 通常已含所需平台）"
          fi
      # 缓存 Gradle 发行版与依赖：这一步是 Android job 最主要的耗时和失败点
      - uses: gradle/actions/setup-gradle@v3
      - name: Build debug APK
        working-directory: android
        # 用 sh 显式执行：Windows 上创建的 gradlew 可能没有可执行位，
        # 直接 ./gradlew 在 Linux runner 上会 Permission denied
        run: sh ./gradlew --no-daemon assembleDebug
